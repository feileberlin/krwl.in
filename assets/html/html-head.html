<style>
/* OSM raster tiles: keep the ecoBarbie treatment on the map imagery only,
   so Leaflet controls, event markers and popups retain their intended colors. */
.leaflet-container {{
    filter: none !important;
    background: #110a0e;
}}
.leaflet-tile {{
    filter: grayscale(100%) brightness(0.58) sepia(85%) hue-rotate(290deg) saturate(180%);
}}
.leaflet-control-attribution {{
    background: rgba(17, 10, 14, 0.88) !important;
    color: #f2e9ee !important;
}}
.leaflet-control-attribution a {{
    color: #e8a5c8 !important;
}}
</style>
