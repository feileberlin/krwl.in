</div><!-- End #app -->

<script>
{embedded_data}

// Basemap provider settings. Change URL and attribution here to switch providers.
window.MAP_TILE_PROVIDER = Object.freeze({{
    url: 'https://{{s}}.tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png',
    attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
}});
if (window.APP_CONFIG && window.APP_CONFIG.map) {{
    window.APP_CONFIG.map.tile_provider = window.MAP_TILE_PROVIDER.url;
    window.APP_CONFIG.map.attribution = window.MAP_TILE_PROVIDER.attribution;
}}

{config_loader}
{fetch_interceptor}
{leaflet_js}

// MapManager currently disables Leaflet attribution. Override that option after
// Leaflet loads so the selected tile provider's required credit is displayed.
if (window.L && window.L.map) {{
    const leafletMapFactory = window.L.map;
    window.L.map = function (container, options) {{
        return leafletMapFactory.call(this, container, {{ ...(options || {{}}), attributionControl: true }});
    }};
}}

{markercluster_js}
{lucide_js}
{app_js}
</script>
</body>
</html>
