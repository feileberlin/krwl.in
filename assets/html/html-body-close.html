</div><!-- End #app -->

<script>
{embedded_data}

// Central basemap/provider settings; use the same OSM tiles on every region.
window.MAP_TILE_PROVIDER = Object.freeze({{
    url: 'https://{{s}}.tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png',
    attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
}});
if (window.APP_CONFIG && window.APP_CONFIG.map) {{
    window.APP_CONFIG.map.tile_provider = window.MAP_TILE_PROVIDER.url;
    window.APP_CONFIG.map.attribution = window.MAP_TILE_PROVIDER.attribution;
}}

{config_loader}
{fetch_interceptor}
{leaflet_js}

// Ensure Leaflet's attribution control stays on so OSM credit is visible.
if (window.L && window.L.map) {{
    const leafletMapFactory = window.L.map;
    window.L.map = function (container, options) {{
        return leafletMapFactory.call(this, container, {{ ...(options || {{}}), attributionControl: true }});
    }};
}}

{markercluster_js}
{lucide_js}
{app_js}

// Keep region-provided custom locations scoped to their region. Older versions
// stored one global list, so migrate known entries by matching their coordinates
// against each region's configured customFilters, then seed missing region presets.
if (typeof EventStorage !== 'undefined') {{
    const regionConfigFor = (storage, regionId) => storage.config?.regions?.[regionId];
    const locationCoordinates = (location) => ({
        lat: location?.center?.lat ?? location?.lat,
        lon: location?.center?.lng ?? location?.center?.lon ?? location?.lon
    });
    const locationName = (location, language = 'en') => {{
        const name = location?.name;
        if (name && typeof name === 'object') {{
            return name[language] || name.en || name.de || Object.values(name)[0];
        }}
        return location?.display_name || name;
    }};

    EventStorage.prototype.getActiveRegionId = function () {{
        return this.activeRegionConfig?.name || this.config?.defaultRegion || 'atlantis';
    }};

    EventStorage.prototype.migrateAndSeedRegionLocations = function () {{
        const regions = this.config?.regions || {{}};
        const locations = Array.isArray(this.customLocations) ? this.customLocations : [];

        locations.forEach((saved) => {{
            if (saved.regionId || saved.scope === 'global') return;

            // Match historical region presets before treating anything as user-created.
            let matchedRegion = null;
            let matchedPreset = null;
            const savedLat = Number(saved.lat);
            const savedLon = Number(saved.lon);
            for (const [regionId, region] of Object.entries(regions)) {{
                const presets = region.customFilters || [];
                const match = presets.find((preset) => {{
                    const coordinates = locationCoordinates(preset);
                    const sameCoordinates = Number.isFinite(savedLat) && Number.isFinite(savedLon) &&
                        Math.abs(savedLat - coordinates.lat) < 0.002 &&
                        Math.abs(savedLon - coordinates.lon) < 0.002;
                    const savedName = String(saved.name || '').trim().toLowerCase();
                    const presetName = String(locationName(preset, region.defaultLanguage) || '').trim().toLowerCase();
                    return sameCoordinates || (saved.fromRegion && savedName && savedName === presetName);
                });
                if (match) {{
                    matchedRegion = regionId;
                    matchedPreset = match;
                    break;
                }}
            }}

            if (matchedRegion && matchedPreset) {{
                saved.regionId = matchedRegion;
                saved.regionLocationId = matchedPreset.id;
                saved.fromRegion = true;
                saved.fromPredefined = true;
            }} else if (saved.fromRegion || saved.fromPredefined) {{
                // Keep unrecognized old presets out of every unrelated region.
                saved.regionId = 'legacy-unmatched';
            }} else {{
                // User-created custom locations remain available in all regions.
                saved.scope = 'global';
            }}
        }});

        const regionId = this.getActiveRegionId();
        const region = regionConfigFor(this, regionId);
        const presets = region?.customFilters || [];
        const language = region?.defaultLanguage || this.config?.defaultLanguage || 'en';

        presets.forEach((preset) => {{
            const coordinates = locationCoordinates(preset);
            if (!Number.isFinite(coordinates.lat) || !Number.isFinite(coordinates.lon)) return;
            const exists = locations.some((saved) =>
                saved.regionId === regionId && saved.regionLocationId === preset.id
            );
            if (exists) return;

            locations.push({{
                id: `region:${{regionId}}:${{preset.id}}`,
                name: locationName(preset, language),
                lat: coordinates.lat,
                lon: coordinates.lon,
                created: new Date().toISOString(),
                regionId,
                regionLocationId: preset.id,
                fromRegion: true,
                fromPredefined: true
            }});
        }});

        this.customLocations = locations;
        this.saveCustomLocations();
        this.log('Region-scoped custom locations ready', {{ regionId, count: presets.length }});
    }};

    EventStorage.prototype.initializeDefaultCustomLocations = function () {{
        this.migrateAndSeedRegionLocations();
    }};

    EventStorage.prototype.getCustomLocations = function () {{
        const regionId = this.getActiveRegionId();
        return this.customLocations.filter((location) =>
            location.scope === 'global' || location.regionId === regionId
        );
    }};

    EventStorage.prototype.getCustomLocationById = function (id) {{
        return this.getCustomLocations().find((location) => location.id === id) || null;
    }};

    EventStorage.prototype.getOriginalPredefinedLocation = function (id) {{
        const saved = this.getCustomLocationById(id);
        if (!saved?.fromRegion) return null;
        const region = regionConfigFor(this, saved.regionId);
        const preset = region?.customFilters?.find((location) => location.id === saved.regionLocationId);
        if (!preset) return null;
        const coordinates = locationCoordinates(preset);
        return {{
            id: preset.id,
            name: locationName(preset, region.defaultLanguage),
            display_name: locationName(preset, region.defaultLanguage),
            lat: coordinates.lat,
            lon: coordinates.lon
        }};
    }};

    EventStorage.prototype.isPredefinedLocationModified = function (id) {{
        const saved = this.getCustomLocationById(id);
        const original = this.getOriginalPredefinedLocation(id);
        return !!(saved && original && (
            saved.name !== original.name ||
            Math.abs(Number(saved.lat) - original.lat) >= 0.0001 ||
            Math.abs(Number(saved.lon) - original.lon) >= 0.0001
        ));
    }};

    EventStorage.prototype.resetCustomLocation = function (id) {{
        const saved = this.getCustomLocationById(id);
        const original = this.getOriginalPredefinedLocation(id);
        if (!saved || !original) return false;
        saved.name = original.name;
        saved.lat = original.lat;
        saved.lon = original.lon;
        this.saveCustomLocations();
        return true;
    }};

    // Discard a previously selected location when it belongs to another region.
    // Run after EventStorage and EventsApp have loaded but before DOMContentLoaded.
    if (typeof EventStorage.prototype.loadFiltersFromCookie === 'function') {{
        const loadFilters = EventStorage.prototype.loadFiltersFromCookie;
        EventStorage.prototype.loadFiltersFromCookie = function () {{
            const filters = loadFilters.call(this);
            if (filters?.selectedCustomLocation &&
                !this.getCustomLocationById(filters.selectedCustomLocation)) {{
                filters.locationType = 'geolocation';
                filters.selectedCustomLocation = null;
                filters.selectedCustomLocationName = null;
                filters.customLat = null;
                filters.customLon = null;
                this.saveFiltersToCookie(filters);
            }}
            return filters;
        }};
    }}
}}
</script>
</body>
</html>
